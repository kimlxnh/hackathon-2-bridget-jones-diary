<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="index.js" defer></script>
  <title>Your Daily Digital Diary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-3" style="max-width: 700px;">

  <h5>My Diary</h5>
  <!-- Create an entry -->
  <form id="form" class="mb-3">
    <input type="datetime-local" id="date" class="form-control mb-2" required>
    <input id="category" class="form-control mb-2" placeholder="Category" required>
    <textarea id="text" class="form-control mb-2" placeholder="What happened?" required></textarea>
    <button class="btn btn-primary btn-sm">Add entry</button>
  </form>

  <!-- Search -->
  <div class="d-flex gap-2 mb-3">
    <input id="search-category" class="form-control form-control-sm" placeholder="Search by category">
    <input id="search-date" type="date" class="form-control form-control-sm">
  </div>

  <!-- Entries get added here -->
  <div id="list">

    <!-- Example of one entry card, which the JS will later repeat for each entry -->
    <div class="card card-body mb-2">
      <div class="small text-muted">06/11/2026, 09:15 | Work</div>
      <p class="mb-2">Started the hackathon project. Got the repo set up.</p>
      <div>
        <button class="btn btn-outline-secondary btn-sm me-2">Edit</button>
        <button class="btn btn-outline-danger btn-sm">Delete</button>
      </div>
    </div>

  </div>
</body>
</html>
